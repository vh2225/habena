# Habena default configuration
# Copy to ~/.habena/config.yaml and customize

# Call-count limits enforce today (every allowed call counts as one, per
# agent type) — they are the runaway-loop guard. Dollar limits
# (daily/monthly/per_session/per_request) are accepted but do NOT enforce
# yet: per-call cost attribution hasn't shipped, so every call is $0.
budget:
  calls:
    per_minute: 120   # rolling 60s window
    per_day: 5000     # calendar day
  # daily: 50         # USD — once cost attribution ships
  # monthly: 500
  # per_session: 20
  # per_request: 5
  alert_at: [50, 80]  # percent thresholds
  on_exceed: deny

registries:
  official:
    url: "https://registry.modelcontextprotocol.io"
    trust_level: verified
  smithery:
    url: "https://smithery.ai"
    trust_level: known
    use_connect: true
  glama:
    url: "https://glama.ai"
    enrich: true

rules:
  # Require approval for outbound communications
  - match: { tool_tag: "communication" }
    action: require_approval
    enforcement: soft_mandatory
    reason: "Outbound communication requires approval"
    timeout: "5m"

  # Restrict file writes to workspace and tmp
  - match: { tool: "filesystem_write" }
    action: deny_unless
    enforcement: soft_mandatory
    condition: { path_starts_with: ["~/workspace", "/tmp"] }
    reason: "File writes restricted to workspace and tmp"

  # Block data exfiltration — sending files to unknown URLs
  - match: { tool: "http_*" }
    action: deny_if
    condition: { body_contains_file_content: true, url_not_in: "~/.habena/trusted_domains.txt" }
    reason: "Potential data exfiltration to untrusted domain"

  # Warn on low-security MCP servers
  - match: { glama_grade: ["D", "F"] }
    action: require_approval
    enforcement: soft_mandatory
    reason: "MCP server has low security grade"

  # Block unknown/unregistered MCP servers
  - match: { registry: "unknown" }
    action: require_approval
    enforcement: soft_mandatory
    reason: "Unregistered MCP server"

  # Allow everything else
  - match: { tool: "*" }
    action: allow

approval:
  timeout: "5m"
  timeout_action: deny
  batch_similar: true

  # --- Phone-tap approvals (Telegram) — optional, disabled by default ---
  # Get one-tap Allow/Deny on your phone when a tool call hits a
  # `require_approval` rule. No extra process — just config.
  # Setup (60s): https://github.com/vh2225/agentguard/blob/main/docs/approval-channels.md
  #
  # channels:
  #   telegram:
  #     token_env: HABENA_TELEGRAM_TOKEN   # keeps the bot token out of this file
  #     owner_id: 123456789                # your numeric Telegram user id
